<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1c2733;
      --card-hover: #243447;
      --accent: #00d4aa;
      --accent2: #7c5cff;
      --text: #e7e9ea;
      --text-dim: #71767b;
      --green: #00ba7c;
      --yellow: #ffd400;
      --red: #ff6b6b;
      --border: #2f3f4f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 24px; }
    
    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: background 0.2s;
    }
    .card:hover { background: var(--card-hover); }
    .card-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }
    .card-sub { color: var(--text-dim); font-size: 0.8rem; }
    .card.accent .card-value { color: var(--accent); }
    .card.accent2 .card-value { color: var(--accent2); }
    .card.green .card-value { color: var(--green); }
    .card.yellow .card-value { color: var(--yellow); }
    .card.red .card-value { color: var(--red); }

    /* ── Charts ── */
    .chart-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
    canvas { max-height: 200px; }

    /* ── Lists ── */
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge.warn { background: var(--yellow); color: #000; }
    .badge.danger { background: var(--red); }
    
    .list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .memory-entry {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .memory-entry:last-child { border-bottom: none; }
    .memory-time { color: var(--text-dim); font-size: 0.75rem; }
    
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 900px;
    }
    .skill-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: default;
      transition: all 0.2s;
      display: inline-block;
      margin: 4px;
      min-width: 160px;
    }
    .skill-tag:hover { border-color: var(--accent); }
    .skill-tag .skill-name { font-weight: 600; color: var(--text); font-size: 0.85rem; }
    .skill-tag .skill-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px; line-height: 1.3; }
    .skill-tag:hover .skill-name { color: var(--accent); }
    .skill-tag:hover .skill-desc { color: rgba(0,212,170,0.8); }

    /* ── Status row ── */
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .status-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      z-index: 100;
      transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .chart-section { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
  <span style="color:var(--text-dim)">加载数据中...</span>
</div>

<!-- Header -->
<h1>🦞 OpenClaw 看板</h1>
<p class="subtitle" id="update-time">—</p>

<!-- Status dots -->
<div class="status-row" id="status-row"></div>

<!-- Key metrics -->
<div class="grid">
  <div class="card accent" id="card-sessions">
    <div class="card-label">活跃 Sessions</div>
    <div class="card-value" id="val-sessions">—</div>
    <div class="card-sub" id="sub-sessions">加载中</div>
  </div>
  <div class="card accent2" id="card-skills">
    <div class="card-label">已安装 Skills</div>
    <div class="card-value" id="val-skills">—</div>
    <div class="card-sub" id="sub-skills">加载中</div>
  </div>
  <div class="card green" id="card-memory">
    <div class="card-label">短期记忆</div>
    <div class="card-value" id="val-memory">—</div>
    <div class="card-sub" id="sub-memory">加载中</div>
  </div>
  <div class="card" id="card-perm" style="border-color:var(--accent2);border-width:2px">
    <div class="card-label">永久记忆</div>
    <div class="card-value" id="val-perm" style="color:var(--accent2)">—</div>
    <div class="card-sub" id="sub-perm">加载中</div>
  </div>
  <div class="card yellow" id="card-gateway">
    <div class="card-label">Gateway 状态</div>
    <div class="card-value" id="val-gateway">—</div>
    <div class="card-sub" id="sub-gateway">加载中</div>
  </div>
</div>

<!-- Charts -->
<div class="chart-section">
  <div class="chart-card">
    <div class="chart-title">📊 Session 数量趋势（最近48次）</div>
    <canvas id="chart-sessions"></canvas>
  </div>
  <div class="chart-card">
    <div class="chart-title">🛠️ Skills 数量变化</div>
    <canvas id="chart-skills"></canvas>
  </div>
</div>

<!-- Skills detail -->
<div class="section">
  <div class="section-title">🛠️ 已安装 Skills <span class="badge" id="skill-count">0</span></div>
  <div class="list-card">
    <div class="skills-grid" id="skills-list"></div>
  </div>
</div>

<!-- Memory files -->
<div class="section">
  <div class="section-title">🧠 短期记忆 <span class="badge" id="mem-count">0</span></div>
  <div class="list-card">
    <div id="memory-list"></div>
  </div>
</div>

<!-- Permanent memory -->
<div class="section">
  <div class="section-title">💎 永久记忆 <span class="badge" id="perm-count" style="background:var(--accent2)">0</span></div>
  <div class="list-card">
    <div id="permanent-list"></div>
  </div>
</div>

<!-- Today activity -->
<div class="section" id="today-section" style="display:none">
  <div class="section-title">📋 今日记录</div>
  <div class="list-card">
    <div class="memory-entry" id="today-memory"></div>
  </div>
</div>

<!-- Raw status -->
<details style="margin-top:24px">
  <summary style="cursor:pointer;color:var(--text-dim);font-size:0.85rem">🔧 原始状态数据</summary>
  <div style="margin-top:12px">
    <textarea id="raw-status" readonly style="width:100%;height:300px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:0.75rem;font-family:monospace" rows="20"></textarea>
  </div>
</details>

<script>
// ── Data URLs ──
const BASE = 'https://vir-limerence.github.io/openclaw-dashboard';

async function loadJSON(url) {
  const nocache = url + '?v=' + Date.now();
  try {
    const r = await fetch(nocache);
    if (r.ok) return r.json();
    return null;
  } catch { return null; }
}

async function loadText(url) {
  const nocache = url + '?v=' + Date.now();
  try {
    const r = await fetch(nocache);
    if (r.ok) return r.text();
    return '';
  } catch { return ''; }
}

async function main() {
  let status = null, skills = null, historyText = '';

  try {
    [status, skills, historyText] = await Promise.all([
      loadJSON(`${BASE}/data/status.json`),
      loadJSON(`${BASE}/data/skills.json`),
      loadText(`${BASE}/data/history_recent.jsonl`)
    ]);
  } catch(e) {
    console.error('Fetch failed:', e);
  }

  // ── Always hide loader ──
  const loading = document.getElementById('loading');
  if (loading) { loading.classList.add('hidden'); setTimeout(() => loading.remove(), 400); }

  if (!status) {
    document.body.innerHTML += '<div style="padding:24px;text-align:center;color:var(--text-dim)"><p>⚠️ 数据加载失败</p><p style="font-size:0.8rem;margin-top:8px">请检查网络后刷新重试</p></div>';
    return;
  }

  document.getElementById('update-time').textContent =
    `最后更新：${status.datetime} · 每小时自动刷新`;</parameter>


  // ── Status row ──
  const row = document.getElementById('status-row');
  const dot = (cls) => `<span class="dot ${cls}"></span>`;
  const items = [
    { label: 'Gateway', val: status.gatewayState, ok: status.gatewayState === 'local' },
    { label: 'Sessions', val: status.sessions, ok: status.sessions > 0 },
    { label: 'Skills', val: status.skillsCount, ok: status.skillsCount > 0 },
    { label: '短期记忆', val: status.shortTermCount || 0, ok: true },
    { label: '永久记忆', val: status.permanentCount || 0, ok: true },
    { label: '更新', val: status.updateAvailable ? '可用' : '最新', ok: !status.updateAvailable, warn: !!status.updateAvailable },
  ];
  row.innerHTML = items.map(i =>
    `<div class="status-item">${dot(i.warn ? 'yellow' : i.ok ? 'green' : 'red')}
      ${i.label}: <strong>${i.val}</strong></div>`
  ).join('');

  // ── Cards ──
  document.getElementById('val-sessions').textContent = status.sessions;
  document.getElementById('sub-sessions').textContent = `Agent数量: ${status.agents}`;

  document.getElementById('val-skills').textContent = status.skillsCount;
  document.getElementById('sub-skills').textContent = status.skillsList
    ? status.skillsList.split(',').slice(0,3).join(', ') + '...'
    : '无数据';

  // Short-term memory
  document.getElementById('val-memory').textContent = status.shortTermCount || 0;
  const memList = (status.memoryList || status.shortTermList || '').split(',').filter(Boolean);
  document.getElementById('sub-memory').textContent = memList.slice(0,3).join(', ') + (memList.length > 3 ? '...' : '');

  // Permanent memory
  document.getElementById('val-perm').textContent = status.permanentCount || 0;
  const permList = (status.permanentList || '').split(',').filter(Boolean);
  document.getElementById('sub-perm').textContent = permList.slice(0,3).join(', ') + (permList.length > 3 ? '...' : '');

  document.getElementById('val-gateway').textContent = status.gatewayState || 'unknown';
  const gwCard = document.getElementById('card-gateway');
  gwCard.className = 'card ' + (status.gatewayState === 'local' ? 'green' : status.gatewayState === 'remote' ? 'yellow' : 'red');

  // ── Skills list with descriptions ──
  if (skills && skills.skills && skills.skills.length > 0 && typeof skills.skills[0] === 'object') {
    document.getElementById('skill-count').textContent = skills.skills.length;
    document.getElementById('skills-list').innerHTML = skills.skills.map(s =>
      `<div class="skill-tag" title="${s.desc || s.name}">
        <div class="skill-name">${s.name}</div>
        <div class="skill-desc">${s.desc || '无描述'}</div>
      </div>`
    ).join('');
  } else if (skills && skills.skills && Array.isArray(skills.skills)) {
    const skills_arr = skills.skills;
    document.getElementById('skill-count').textContent = skills_arr.length;
    document.getElementById('skills-list').innerHTML = skills_arr.map(s =>
      `<div class="skill-tag" title="${s}"><div class="skill-name">${s}</div></div>`
    ).join('');
  } else if (status.skillsList) {
    const skills_arr = status.skillsList.split(',').filter(Boolean);
    document.getElementById('skill-count').textContent = skills_arr.length;
    document.getElementById('skills-list').innerHTML = skills_arr.map(s =>
      `<div class="skill-tag"><div class="skill-name">${s}</div></div>`
    ).join('');
  }

  // ── Memory files ──
  const memList = (status.memoryList || status.shortTermList || '').split(',').filter(Boolean);
  if (memList.length > 0 && memList[0]) {
    document.getElementById('mem-count').textContent = memList.length;
    document.getElementById('memory-list').innerHTML = memList.map(m =>
      `<div class="memory-entry">📄 ${m}</div>`
    ).join('');
  } else {
    document.getElementById('memory-list').innerHTML = '<div class="memory-entry" style="color:var(--text-dim)">暂无短期记忆</div>';
  }

  // ── Permanent memory ──
  const permList = (status.permanentList || '').split(',').filter(Boolean);
  if (permList.length > 0 && permList[0]) {
    document.getElementById('perm-count').textContent = permList.length;
    document.getElementById('permanent-list').innerHTML = permList.map(m =>
      `<div class="memory-entry">💎 ${m}</div>`
    ).join('');
  } else {
    document.getElementById('permanent-list').innerHTML = '<div class="memory-entry" style="color:var(--text-dim)">暂无永久记忆</div>';
  }

  // ── Today memory ──
  if (status.todayMemory && status.todayMemory.trim().length > 10) {
    document.getElementById('today-section').style.display = 'block';
    document.getElementById('today-memory').textContent = status.todayMemory;
  }

  // ── Raw status ──
  if (status.rawStatus) {
    document.getElementById('raw-status').value = status.rawStatus;
  }

  // ── Charts ──
  const history = [];
  if (historyText) {
    historyText.trim().split('\n').forEach(line => {
      try { history.push(JSON.parse(line)); } catch {}
    });
  }
  if (history.length === 0 && status) history.push(status);

  const labels = history.map(h => {
    const d = new Date(h.timestamp * 1000);
    return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:00`;
  }).reverse();
  const sessionData = history.map(h => h.sessions || 0).reverse();
  const skillsData = history.map(h => h.skillsCount || 0).reverse();

  const chartOpts = {
    responsive: true, maintainAspectRatio: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#71767b', font: { size: 10 } }, grid: { color: '#1c2733' } },
      y: { ticks: { color: '#71767b' }, grid: { color: '#1c2733' }, beginAtZero: true }
    }
  };

  new Chart(document.getElementById('chart-sessions'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: sessionData,
        borderColor: '#00d4aa',
        backgroundColor: 'rgba(0,212,170,0.1)',
        fill: true, tension: 0.4, pointRadius: 2, pointHoverRadius: 5
      }]
    },
    options: chartOpts
  });

  new Chart(document.getElementById('chart-skills'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: skillsData,
        backgroundColor: '#7c5cff', borderRadius: 4
      }]
    },
    options: { ...chartOpts, plugins: { legend: { display: false } } }
  });
  } catch(e) {
    console.error(e);
    const loading = document.getElementById('loading');
    if (loading) { loading.classList.add('hidden'); setTimeout(() => loading.remove(), 400); }
    document.body.innerHTML += '<p style="color:var(--red);padding:24px">⚠️ 页面加载出错，请刷新重试</p>';
  }
}

main();
</script>
</body>
</html>
