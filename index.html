<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1c2733;
      --card-hover: #243447;
      --accent: #00d4aa;
      --accent2: #7c5cff;
      --text: #e7e9ea;
      --text-dim: #71767b;
      --green: #00ba7c;
      --yellow: #ffd400;
      --red: #ff6b6b;
      --border: #2f3f4f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 24px; }
    
    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: background 0.2s;
    }
    .card:hover { background: var(--card-hover); }
    .card-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }
    .card-sub { color: var(--text-dim); font-size: 0.8rem; }
    .card.accent .card-value { color: var(--accent); }
    .card.accent2 .card-value { color: var(--accent2); }
    .card.green .card-value { color: var(--green); }
    .card.yellow .card-value { color: var(--yellow); }
    .card.red .card-value { color: var(--red); }

    /* ── Charts ── */
    .chart-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
    canvas { max-height: 200px; }

    /* ── Lists ── */
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge.warn { background: var(--yellow); color: #000; }
    .badge.danger { background: var(--red); }
    
    .list-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .memory-entry {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .memory-entry:last-child { border-bottom: none; }
    .memory-time { color: var(--text-dim); font-size: 0.75rem; }
    
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 900px;
    }
    .skill-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: default;
      transition: all 0.2s;
      display: inline-block;
      margin: 4px;
      min-width: 160px;
    }
    .skill-tag:hover { border-color: var(--accent); }
    .skill-tag .skill-name { font-weight: 600; color: var(--text); font-size: 0.85rem; }
    .skill-tag .skill-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px; line-height: 1.3; }
    .skill-tag:hover .skill-name { color: var(--accent); }
    .skill-tag:hover .skill-desc { color: rgba(0,212,170,0.8); }

    /* ── Status row ── */
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .status-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      z-index: 100;
      transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .chart-section { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
  <span style="color:var(--text-dim)">加载数据中...</span>
</div>

<!-- Header -->
<h1>🦞 OpenClaw 看板</h1>
<p class="subtitle" id="update-time">—</p>

<!-- Status dots -->
<div class="status-row" id="status-row"></div>

<!-- Key metrics -->
<div class="grid">
  <div class="card accent" id="card-sessions">
    <div class="card-label">活跃 Sessions</div>
    <div class="card-value" id="val-sessions">—</div>
    <div class="card-sub" id="sub-sessions">加载中</div>
  </div>
  <div class="card accent2" id="card-skills">
    <div class="card-label">已安装 Skills</div>
    <div class="card-value" id="val-skills">—</div>
    <div class="card-sub" id="sub-skills">加载中</div>
  </div>
  <div class="card green" id="card-memory">
    <div class="card-label">短期记忆</div>
    <div class="card-value" id="val-memory">—</div>
    <div class="card-sub" id="sub-memory">加载中</div>
  </div>
  <div class="card" id="card-perm" style="border-color:var(--accent2);border-width:2px">
    <div class="card-label">永久记忆</div>
    <div class="card-value" id="val-perm" style="color:var(--accent2)">—</div>
    <div class="card-sub" id="sub-perm">加载中</div>
  </div>
  <div class="card yellow" id="card-gateway">
    <div class="card-label">Gateway 状态</div>
    <div class="card-value" id="val-gateway">—</div>
    <div class="card-sub" id="sub-gateway">加载中</div>
  </div>
</div>

<!-- Charts -->
<div class="chart-section">
  <div class="chart-card">
    <div class="chart-title">📊 Session 数量趋势（最近48次）</div>
    <canvas id="chart-sessions"></canvas>
  </div>
  <div class="chart-card">
    <div class="chart-title">🛠️ Skills 数量变化</div>
    <canvas id="chart-skills"></canvas>
  </div>
</div>

<!-- Skills detail -->
<div class="section">
  <div class="section-title">🛠️ 已安装 Skills <span class="badge" id="skill-count">0</span></div>
  <div class="list-card">
    <div class="skills-grid" id="skills-list"></div>
  </div>
</div>

<!-- Memory files -->
<div class="section">
  <div class="section-title">🧠 短期记忆 <span class="badge" id="mem-count">0</span></div>
  <div class="list-card">
    <div id="memory-list"></div>
  </div>
</div>

<!-- Permanent memory -->
<div class="section">
  <div class="section-title">💎 永久记忆 <span class="badge" id="perm-count" style="background:var(--accent2)">0</span></div>
  <div class="list-card">
    <div id="permanent-list"></div>
  </div>
</div>

<!-- Today activity -->
<div class="section" id="today-section" style="display:none">
  <div class="section-title">📋 今日记录</div>
  <div class="list-card">
    <div class="memory-entry" id="today-memory"></div>
  </div>
</div>

<!-- Raw status -->
<details style="margin-top:24px">
  <summary style="cursor:pointer;color:var(--text-dim);font-size:0.85rem">🔧 原始状态数据</summary>
  <div style="margin-top:12px">
    <textarea id="raw-status" readonly style="width:100%;height:300px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:0.75rem;font-family:monospace" rows="20"></textarea>
  </div>
</details>

<script src="./script.js"></script>
</body>
</html>
